<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Projects">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38e1ff"/>
      <stop offset="1" stop-color="#8a3cff"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3ec8"/>
      <stop offset="1" stop-color="#e3304b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Four launch tiles with cut corners; one is live -->
  <path d="M10 10H28V24L24 28H10Z" fill="url(#tile)" opacity=".9"/>
  <path d="M36 10H54V28H40L36 24Z" fill="url(#tile)" opacity=".55"/>
  <path d="M10 40L14 36H28V54H10Z" fill="url(#tile)" opacity=".55"/>
  <path d="M36 36H54V50L50 54H36Z" fill="url(#hot)" filter="url(#glow)"/>
  <!-- Launch arrow on the live tile -->
  <path d="M41 49L49 41M43 41H49V47" fill="none" stroke="#07080d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
