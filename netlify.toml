# Netlify configuration for the static site + chat functions.
# There is no build step: the site is plain HTML/CSS/ES modules.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The sealed (encrypted) Dead Circuit PDF ships with the download function;
# DC_PDF_KEY decrypts it at request time. See netlify/lib/dead-circuit/sealed-pdf.mjs.
[functions."dc-download"]
  included_files = ["netlify/private/issue-01.pdf.enc"]

# The sealed file is useless without the key, but it has no reason to be
# served as a static file either.
[[redirects]]
  from = "/netlify/private/*"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
