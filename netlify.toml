# Netlify configuration for the static site + chat functions.
# There is no build step: the site is plain HTML/CSS/ES modules.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Sealed (encrypted) Dead Circuit PDFs, one per language. Public on purpose:
# they are noise without DC_PDF_KEY, which only dc-download holds.
# See netlify/lib/dead-circuit/sealed-pdf.mjs.
[[headers]]
  for = "/dead-circuit/sealed/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
